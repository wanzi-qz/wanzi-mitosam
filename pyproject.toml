[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mitosam"
version = "0.4.0"
description = "MitoSAM — promptable mitochondria segmentation & quantification on super-resolution microscopy"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "MitoSAM contributors" }]
keywords = ["segment-anything", "microscopy", "mitochondria", "super-resolution", "bioimage-analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "scikit-image>=0.21",
    "scikit-learn>=1.3", "pillow>=10.0", "pyyaml>=6.0", "matplotlib>=3.7",
]

[project.optional-dependencies]
train = ["torch>=2.0", "tqdm>=4.65", "opencv-python>=4.8"]
explain = ["shap>=0.44", "xgboost>=2.0", "lightgbm>=4.0"]
deploy = ["onnx>=1.15", "onnxruntime>=1.17"]
gui = ["gradio>=4.0"]
all = ["mitosam[train,explain,deploy,gui]"]

[project.scripts]
mitosam = "MitoSAM.cli:main"

[tool.setuptools.packages.find]
include = ["MitoSAM*"]

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
